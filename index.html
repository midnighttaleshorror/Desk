<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deskwork</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",sans-serif;background:#0f172a;color:#e2e8f0}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:#1e293b}
header b{font-size:20px;color:#38bdf8;margin-right:auto}
.tab{background:#334155;color:#e2e8f0;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}
.tab.on{background:#0284c7}
main{padding:20px;max-width:560px;margin:auto}
label{display:block;margin:12px 0 4px;font-size:13px;color:#94a3b8}
label.chk{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:14px;color:#e2e8f0}
label.chk input{width:auto}
input[type=text],input[type=password],input:not([type]){width:100%;padding:10px;border-radius:6px;border:1px solid #475569;background:#1e293b;color:#fff;font-size:15px}
button.go{margin-top:16px;width:100%;padding:12px;border:0;border-radius:6px;background:#0284c7;color:#fff;font-size:16px;cursor:pointer}
button.stop{background:#dc2626}
button.ok{background:#16a34a}
.id{font-size:34px;letter-spacing:3px;text-align:center;margin:14px 0;color:#38bdf8}
.msg{margin-top:12px;min-height:20px;font-size:14px;color:#fbbf24}
.box{margin-top:16px;padding:12px;border:1px solid #334155;border-radius:8px;background:#111c33}
.box h4{margin:0 0 6px;font-size:14px;color:#38bdf8}
.log{height:120px;overflow:auto;background:#0b1224;border-radius:6px;padding:6px;font-size:13px;margin-bottom:6px}
#prompt{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20}
#prompt div{background:#1e293b;padding:24px;border-radius:10px;width:340px;text-align:center}
#prompt button{width:46%;padding:10px;border:0;border-radius:6px;color:#fff;font-size:15px;cursor:pointer;margin:6px 2%}
#stage{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;outline:0}
#vid{width:100%;height:100%;object-fit:contain}
#bar{position:fixed;top:6px;right:6px;display:flex;gap:6px;opacity:.8;z-index:5}
#bar button,#side button{padding:6px 12px;border:0;border-radius:6px;background:#1e293bdd;color:#fff;cursor:pointer}
#side{position:fixed;top:44px;right:6px;bottom:6px;width:340px;background:#0f172af2;border:1px solid #334155;border-radius:8px;padding:10px;display:flex;flex-direction:column;z-index:6}
#side .tabs{display:flex;gap:6px;margin-bottom:8px}
#side .tabs button.on{background:#0284c7}
#tChat,#tFiles{flex:1;display:flex;flex-direction:column;min-height:0}
#vLog,#fList{flex:1;overflow:auto;background:#0b1224;border-radius:6px;padding:6px;font-size:13px;margin-bottom:6px}
#fList div{padding:4px 6px;cursor:pointer;border-radius:4px;display:flex;justify-content:space-between;gap:8px}
#fList div:hover{background:#1e293b}
#fPath{font-size:12px;color:#94a3b8;margin-bottom:6px;word-break:break-all}
#permInfo,#fStatus{font-size:12px;color:#fbbf24;margin-top:6px;min-height:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><b>Deskwork</b>
<button class="tab on" data-t="host">Office PC (Host)</button>
<button class="tab" data-t="viewer">Home PC (Viewer)</button></header>
<main>
<label>Server address</label>
<input id="server" placeholder="wss://your-name.onrender.com">

<section id="host">
<label>Password (at least 6 characters)</label>
<input id="hPass" type="text">
<label class="chk"><input type="checkbox" id="hAsk"> Ask for my permission when a viewer connects</label>
<div class="box">
<h4>Permissions for the viewer</h4>
<label class="chk"><input type="checkbox" id="p_control"> Control mouse and keyboard</label>
<label class="chk"><input type="checkbox" id="p_files"> File transfer</label>
<label class="chk"><input type="checkbox" id="p_clip"> Clipboard</label>
</div>
<button class="go" id="hStart">Start sharing</button>
<div class="id" id="hId"></div>
<div class="msg" id="hMsg"></div>

<div class="box" id="hSess" hidden>
<h4>Viewer connected</h4>
<div class="log" id="hLog"></div>
<input id="hChatIn" placeholder="Type a message and press Enter">
<div class="msg" id="hXfer"></div>
<button class="go stop" id="hDisc">Disconnect viewer</button>
</div>
</section>

<section id="viewer" hidden>
<div id="vForm">
<label>Office PC ID</label>
<input id="vId" placeholder="123456789">
<label>Password</label>
<input id="vPass" type="password">
<button class="go" id="vConnect">Connect</button>
<div class="msg" id="vMsg"></div>
</div>
</section>
</main>

<div id="prompt" hidden><div>
<h3>A viewer wants to connect</h3>
<p style="color:#94a3b8;font-size:14px">Allow this person to see and use this PC? You can change the permissions in the main window at any time.</p>
<button class="ok" id="hAccept">Accept</button><button class="stop" id="hDeny">Deny</button>
</div></div>

<div id="stage" tabindex="0" hidden>
<video id="vid" autoplay playsinline muted></video>
<div id="bar">
<button id="vSideBtn">Chat / Files</button>
<button id="cSend">Send clipboard</button>
<button id="cGet">Get clipboard</button>
<button id="vFull">Full screen</button>
<button id="vStop">Disconnect</button>
</div>
<div id="side" hidden>
<div class="tabs"><button id="tabC" class="on">Chat</button><button id="tabF">Files</button></div>
<div id="tChat"><div id="vLog"></div><input id="vChatIn" placeholder="Type a message and press Enter"></div>
<div id="tFiles" hidden>
<div id="fPath"></div>
<div id="fList"></div>
<button id="fUp">Upload a file here</button>
</div>
<div id="fStatus"></div>
<div id="permInfo"></div>
</div>
</div>
<script src="renderer.js"></script>
</body>
</html>
