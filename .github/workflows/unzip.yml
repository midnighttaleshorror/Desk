name: Unzip project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract all zip files in repo root
        run: |
          shopt -s nullglob
          for z in *.zip; do
            unzip -o "$z" -x ".github/*"
            rm "$z"
          done
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Extract project" || echo "nothing to commit"
          git push
